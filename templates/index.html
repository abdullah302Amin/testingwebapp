<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translation Service</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin-bottom: 10px;
        }
        .translation {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Translation Service</h1>
        <form method="POST">
            <label for="language">Select Target Language:</label><br>
            <select id="language" name="language" required>
                <option value="ar">Arabic</option>
                <option value="hi">Hindi</option>
                <option value="ur">Urdu</option>
            </select><br><br>

            <label for="text">Enter text to translate:</label><br>
            <textarea id="text" name="text" required>{{ original_text or "" }}</textarea><br>
            <button type="submit">Translate</button>
        </form>

        {% if translated_text %}
        <div class="translation">
            <h2>Translated Text ({{ target_language }}):</h2>
            <p>{{ translated_text }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
