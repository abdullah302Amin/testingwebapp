<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translation Service</title>
<style>
body {
font-family: Arial, sans-serif;
margin: 20px;
}
.container {
max-width: 600px;
margin: auto;
}
textarea {
width: 100%;
height: 100px;
margin-bottom: 10px;
}
.translation {
margin-top: 20px;
}
.translation div {
margin-bottom: 10px;
}
</style>
</head>
<body>
<div class="container">
<h1>Translation Service</h1>
<form method="POST">
<label for="text">Enter text to translate:</label><br>
<textarea id="text" name="text">{{ original_text or "" }}</textarea><br>
<button type="submit">Translate</button>
</form>
{% if translations %}
<div class="translation">
<h2>Translated Text:</h2>
{% for translation in translations %}
<div>
<strong>{{ translation.language }}:</strong> {{ translation.translated_text }}
</div>
{% endfor %}
</div>
{% endif %}
</div>
</body>
</html>
