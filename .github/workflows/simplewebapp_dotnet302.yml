# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP app to Azure Web App - dotnet302

on:
  push:
    branches:
      - SimpleWebApp
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up .NET Framework SDK
      - name: Setup .NET Framework
        uses: microsoft/setup-msbuild@v1

      # Step 3: Restore NuGet packages
      - name: Restore NuGet Packages
        run: nuget restore SimpleWebApp/SimpleWebApp.sln

      # Step 4: Build the solution
      - name: Build Solution
        run: msbuild /nologo /verbosity:m /t:Build /t:pipelinePreDeployCopyAllFilesToOneFolder /p:_PackageTempDir="\published\" SimpleWebApp/SimpleWebApp.sln

      # Step 5: Publish the application (Optional)
      - name: Publish Application
        run: |
          msbuild SimpleWebApp/SimpleWebApp/SimpleWebApp.csproj /p:Configuration=Release /p:DeployOnBuild=true /p:PublishProfile=Azure /p:SkipInvalidConfigurations=true

      # Step 6: Deploy to Azure (Optional)
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'dotnet302'
          slot-name: 'Production'
          package: .
          
